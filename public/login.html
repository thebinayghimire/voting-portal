<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Elite Grand School Voting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/theme.css" />
  </head>
  <body class="auth-page">
    <div class="login-card auth-card">
      <div class="login-logo-wrap">
        <img
          src="photos/elitelogo.jpg"
          alt="Elite Grand School"
          class="login-logo"
        />
        <span class="login-school-name">Elite Grand School</span>
        <span class="login-portal-tag">Student Voting Portal</span>
      </div>

      <div class="login-divider"></div>

      <p class="login-heading">Student Login</p>
      <p class="login-hint">Enter your credentials to access the ballot.</p>

      <div id="status-banner" class="msg info hidden"></div>
      <div id="error-msg" class="msg error hidden"></div>

      <div class="form-group">
        <label for="student-id">Email</label>
        <input
          type="email"
          id="student-id"
          placeholder="e.g. student@example.com"
          autocomplete="off"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-field">
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button
            type="button"
            id="password-toggle"
            class="password-toggle"
            aria-label="Show password"
            aria-pressed="false"
          >
            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="icon-eye-off hidden" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3l18 18" />
              <path d="M10.7 5.2A10.5 10.5 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.1 3" />
              <path d="M6.5 6.8C3.6 8.7 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4.1-.9" />
              <path d="M10.6 10.6A2 2 0 0 0 12 14a2 2 0 0 0 1.4-.6" />
            </svg>
          </button>
        </div>
      </div>

      <button id="login-btn">Login</button>

      <p class="login-footer-note">
        Forgot your credentials? Contact your class teacher.
      </p>
    </div>

    <script src="js/login.js"></script>
  </body>
</html>
