<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Elite Grand School Voting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="auth-page">
  <div class="login-card auth-card">
    <div class="login-logo-wrap">
      <img src="photos/elitelogo.jpg" alt="Elite Grand School" class="login-logo" />
      <span class="login-school-name">Elite Grand School</span>
      <span class="login-portal-tag">Student Voting Portal</span>
    </div>

    <div class="login-divider"></div>

    <p class="login-heading">Student Login</p>
    <p class="login-hint">Enter your credentials to access the ballot.</p>

    <div id="status-banner" class="msg info hidden"></div>
    <div id="error-msg" class="msg error hidden"></div>

    <div class="form-group">
      <label for="student-id">Email</label>
      <input type="email" id="student-id" placeholder="e.g. student@example.com" autocomplete="off" />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" />
    </div>

    <button id="login-btn">Login</button>

    <p class="login-footer-note">Forgot your credentials? Contact your class teacher.</p>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
